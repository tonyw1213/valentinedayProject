<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine? 💕</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="hearts">
            <div class="heart"></div>
            <div class="heart"></div>
            <div class="heart"></div>
            <div class="heart"></div>
            <div class="heart"></div>
        </div>

        <div class="content" id="question-screen">
            <h1 class="question">Coco, Will You Be My Valentine? 💕</h1>
            <p class="subtitle">- Love, Tony</p>
            <div class="gif-container">
                <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExcXV5d2N5aGhkZ2N5dTRkYmN5dTRkYmN5dTRkYmN5dTRkYmN5dTRkYmMmZXA9djFfaW50ZXJuYWxfZ2lmX2J5X2lkJmN0PWc/3o7qDSOvfaCO9b3MlO/giphy.gif" alt="Cute asking" class="cute-gif">
            </div>
            <div class="buttons">
                <button class="yes-btn" id="yes-btn">Yes! 💖</button>
                <button class="no-btn" id="no-btn">No</button>
            </div>
        </div>

        <div class="content hidden" id="success-screen">
            <h1 class="success-title">Yay! 🎉💕</h1>
            <p class="success-message">You just made Tony the happiest person ever! ❤️</p>
            <div class="gif-container">
                <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExYzV5d2N5aGhkZ2N5dTRkYmN5dTRkYmN5dTRkYmN5dTRkYmN5dTRkYmMmZXA9djFfaW50ZXJuYWxfZ2lmX2J5X2lkJmN0PWc/MOWPkhRAUbR7i/giphy.gif" alt="Happy celebration" class="cute-gif">
            </div>
            <p class="date-message">Can't wait to celebrate Valentine's Day with you, Coco! 💝</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
